<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo digital de ropa BOU&MUS.">
  <title>Catálogo | BOU&amp;MUS</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <a class="brand" href="#catalogo" aria-label="Ir al catálogo BOU&MUS">
      <span class="brand-mark">BM</span>
      <span class="brand-name">BOU&amp;MUS</span>
    </a>
    <a class="header-link" href="#catalogo">Catálogo <span>↓</span></a>
  </header>

  <main id="catalogo">
    <div class="toolbar">
      <label class="search">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Buscar prenda, color o código" aria-label="Buscar una prenda">
      </label>
      <div id="filters" class="filters" aria-label="Categorías del catálogo"></div>
    </div>

    <div class="result">
      <span id="count">Cargando catálogo…</span>
      <span>Disponibilidad actual</span>
    </div>

    <section id="products" class="products" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>No encontramos prendas con esa búsqueda.</p>
  </main>

  <footer>
    <div class="footer-brand">
      <span class="brand-mark">BM</span>
      <span class="brand-name">BOU&amp;MUS</span>
    </div>
    <p>Catálogo digital · Precios en pesos mexicanos</p>
  </footer>

  <dialog id="product-viewer" class="product-viewer" aria-labelledby="viewer-name">
    <button id="viewer-close" class="viewer-close" type="button" aria-label="Cerrar detalles">×</button>

    <div class="modal-gallery">
      <div id="thumbnails" class="thumbnails" aria-label="Fotografías del producto"></div>
      <div class="modal-main-image">
        <img id="viewer-image" src="" alt="">
      </div>
    </div>

    <div class="modal-details">
      <p id="viewer-category" class="modal-category"></p>
      <h2 id="viewer-name"></h2>
      <p id="viewer-model" class="modal-model"></p>
      <p id="viewer-price" class="modal-price"></p>

      <dl class="specs">
        <div>
          <dt>Color</dt>
          <dd id="viewer-color"></dd>
        </div>
        <div>
          <dt>Talla</dt>
          <dd><span id="viewer-sizes" class="size-options"></span></dd>
        </div>
        <div>
          <dt>Estado</dt>
          <dd id="viewer-state" class="available"></dd>
        </div>
        <div>
          <dt>Código</dt>
          <dd id="viewer-code"></dd>
        </div>
      </dl>

      <div class="modal-actions">
        <button id="order-product" class="order-product" type="button">
          <span>Pedir por WhatsApp</span><span>↗</span>
        </button>
        <button id="share-product" class="share-product" type="button">
          <span id="share-label">Compartir producto</span><span>↗</span>
        </button>
      </div>
      <p class="modal-note">Selecciona una talla disponible antes de enviar tu solicitud.</p>
    </div>
  </dialog>

  <script src="productos.js"></script>
  <script src="app.js"></script>
</body>
</html>
